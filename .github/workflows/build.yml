name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Android SDK が入っているイメージに固定
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"

      - name: Build
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log || {
            # エラー行をGitHubの画面（注釈）に出す
            grep -E "^e: |error:|What went wrong|Could not|Failed|> " build.log | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          }

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk health-log.apk

      - uses: actions/upload-artifact@v4
        with:
          name: health-log
          path: health-log.apk

      # スマホからそのままダウンロードできるよう「Releases」にも置く
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新版
          files: health-log.apk
          make_latest: true
